<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code | DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
    <script>
        function addLang(langName )
        {
            const li=document.createElement('li')
            li.innerHTML=langName
            document.querySelector('.language').appendChild(li);//this is problematic as it is traversing the whole tree and then
            //appending the child and when there are say 1000 lang it will go there traversing the whole tree
            
        }
        addLang("Java")
        addLang('Css')

        function addOptiLang(langName)
        {
            const li=document.createElement('li');
            li.appendChild(document.createTextNode(langName));//here we are not traversing the whole tree nodes
            document.querySelector('.language').appendChild(li);
        }
        addOptiLang('Cpp')
        addOptiLang('Python')

        //edit these elements
        const secondLang = document.querySelector("li:nth-child(2)")
        console.log(secondLang);
        //secondLang.innerHTML = "Mojo"
        const newli = document.createElement('li')
        newli.textContent = "Mojo"
        secondLang.replaceWith(newli)

        //edit
        const firstLang = document.querySelector("li:first-child")
        firstLang.outerHTML = '<li>TypeScript</li>'

        //remove
        const lastLang = document.querySelector('li:last-child')
        lastLang.remove()
        const lastLang2 = document.querySelector('li:last-child')
        lastLang2.remove()
    </script>
</body>
</html>
