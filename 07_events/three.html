<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async project</title>
</head>
<body>
    <H1>Chai aur Code</H1>
    <button class="start">Start</button>
    <button class="stop">Stop</button>
</body>
<script>
    let intervalId;
    const date=function(str)
    {
        console.log(str,Date.now());
    }
    function id(){
        intervalId= setInterval(date,1000,"santa");
    }
    function stid(){
        clearInterval(intervalId);
    }
    document.querySelector('.start').addEventListener('click',id)
    document.querySelector('.stop').addEventListener('click',stid)
</script>
</html>
