<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
    <script>
        class React {
        constructor(){
            this.library = "React"
            this.server = "https://localhost:300"

            //requirement : create a new object on loading of page, const app = new React()
            // give a refrence and on clicking button i get something
            document
                .querySelector('button')
                .addEventListener('click', this.handleClick.bind(this))

        }
        handleClick()
        {
            console.log("button clicked");
            console.log(this.server);// so here it is not printing: this refrence is lost somewhere
            //use .bind(this)
            console.log(this)//returns the refrence of the button which means only this.server is lost
        }
    }
    const app = new React()
    </script>
</body>
</html>
